<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Irery: a glowing orb under falling rain, above the word irery">
  <title>Irery</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081a" />
      <stop offset="0.55" stop-color="#0f1a2b" />
      <stop offset="1" stop-color="#1b2747" />
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.25" stop-color="#cfe9ef" />
      <stop offset="0.6" stop-color="#9cc3e6" />
      <stop offset="1" stop-color="#3a4f7a" />
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc3e6" stop-opacity="0.45" />
      <stop offset="1" stop-color="#9cc3e6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3e6" stop-opacity="0" />
      <stop offset="1" stop-color="#cfe9ef" stop-opacity="0.7" />
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="340" rx="28" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="340" fill="url(#sky)" />

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="62" cy="48" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite" /></circle>
      <circle cx="148" cy="96" r="0.9" opacity="0.5" />
      <circle cx="214" cy="34" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="5.5s" repeatCount="indefinite" /></circle>
      <circle cx="318" cy="72" r="0.8" opacity="0.4" />
      <circle cx="642" cy="40" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.6s" repeatCount="indefinite" /></circle>
      <circle cx="736" cy="88" r="0.9" opacity="0.5" />
      <circle cx="812" cy="30" r="1.5" opacity="0.8" />
      <circle cx="904" cy="70" r="1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="6s" repeatCount="indefinite" /></circle>
      <circle cx="878" cy="150" r="0.8" opacity="0.4" />
      <circle cx="96" cy="170" r="0.8" opacity="0.4" />
    </g>

    <!-- rain -->
    <g stroke="url(#drop)" stroke-width="1.4" stroke-linecap="round">
      <line x1="120" y1="-40" x2="112" y2="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="-60 400" dur="1.6s" repeatCount="indefinite" /></line>
      <line x1="260" y1="-40" x2="252" y2="0"><animateTransform attributeName="transform" type="translate" from="0 -60" to="-60 340" dur="1.9s" repeatCount="indefinite" /></line>
      <line x1="390" y1="-40" x2="382" y2="0"><animateTransform attributeName="transform" type="translate" from="0 -150" to="-60 250" dur="1.4s" repeatCount="indefinite" /></line>
      <line x1="610" y1="-40" x2="602" y2="0"><animateTransform attributeName="transform" type="translate" from="0 -20" to="-60 380" dur="1.7s" repeatCount="indefinite" /></line>
      <line x1="720" y1="-40" x2="712" y2="0"><animateTransform attributeName="transform" type="translate" from="0 -110" to="-60 290" dur="2.1s" repeatCount="indefinite" /></line>
      <line x1="860" y1="-40" x2="852" y2="0"><animateTransform attributeName="transform" type="translate" from="0 -70" to="-60 330" dur="1.5s" repeatCount="indefinite" /></line>
      <line x1="960" y1="-40" x2="952" y2="0"><animateTransform attributeName="transform" type="translate" from="0 -180" to="-60 220" dur="1.8s" repeatCount="indefinite" /></line>
    </g>

    <!-- calm water line -->
    <path d="M0 292 C160 284 320 300 480 292 C640 284 800 300 960 292 V340 H0 Z" fill="#0a1424" opacity="0.85" />
    <path d="M0 292 C160 284 320 300 480 292 C640 284 800 300 960 292" fill="none" stroke="#9cc3e6" stroke-opacity="0.25" stroke-width="1.2" />

    <!-- orb -->
    <circle cx="480" cy="120" r="96" fill="url(#halo)">
      <animate attributeName="r" values="88;104;88" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="120" r="54" fill="none" stroke="#cfe9ef" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="54;120" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="120" r="54" fill="url(#orb)">
      <animate attributeName="r" values="52;56;52" dur="9s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="462" cy="100" rx="18" ry="10" fill="#ffffff" opacity="0.35" transform="rotate(-28 462 100)" />
    <!-- reflection -->
    <ellipse cx="480" cy="306" rx="46" ry="5" fill="#9cc3e6" opacity="0.22" />

    <!-- wordmark -->
    <text x="480" y="232" text-anchor="middle" font-family="'Outfit', 'Avenir Next', 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="300" letter-spacing="18" fill="#eef4fb">irery</text>
    <text x="480" y="266" text-anchor="middle" font-family="'Outfit', 'Avenir Next', 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" letter-spacing="4.5" fill="#9cc3e6" opacity="0.85">YOUR OWN QUIET BUBBLE</text>
  </g>
</svg>
